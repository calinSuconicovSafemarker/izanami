version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1 only; lint breaks on 7.x (tried 2026-11-20).
      - dependency-name: typescript
        versions: ['>=7']
      # Types must match the Node major we run (CI and the Lambda: Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
